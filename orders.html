<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сытый кот — Заказы</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/lunch.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@553&family=Climate+Crisis:YEAR@1979&family=Comfortaa:wght@700&family=Didact+Gothic&family=Rubik+Broken+Fax&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <h1>Сытый кот</h1>
        <nav>
            <a href="index.html">О нас</a>
            <a href="buy_lunch.html">Собрать ланч</a>
            <a href="order.html">Оформить заказ</a>
            <a href="orders.html" id="active">Заказы</a>
            <a href="#id_footer">Контакты</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>История заказов</h2>
            <p id="no-orders" hidden>У вас пока нет заказов. Перейдите на страницу <a href="buy_lunch.html">Собрать ланч</a>, чтобы оформить первый.</p>

            <div class="orders-wrap">
                <table class="orders-table" id="orders-table" hidden>
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Дата оформления</th>
                            <th>Состав заказа</th>
                            <th>Стоимость</th>
                            <th>Время доставки</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="id_footer">
        <p class="footer_text">Позвонить нам:<a href="tel:+72281895267" class="footer_link">+7(228)189-52-67</a></p>
    </footer>

    <!-- dishes.js даёт API_KEY, API_BASE и loadDishes; check.js даёт showNotification -->
    <script src="js/dishes.js"></script>
    <script src="js/check.js"></script>
    <script src="js/orders_history.js"></script>
</body>
</html>
